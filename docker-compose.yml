services:
  postgres:
    image: postgres:16-alpine
    container_name: tumaride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tumaride
    ports:
      - "5432:5432"
    volumes:
      - tumaride_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tumaride"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: tumaride-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tumaride?schema=public
      JWT_SECRET: tumaride-local-docker-jwt-secret
      STELLAR_NETWORK: TESTNET
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      TUMARIDE_ESCROW_CONTRACT_ID: CB7KRT357CZNYU3XEPAX26SHM37QGJW75Z3RVUGRSKMFUOZSKLZQ7PJ4
      USDC_TOKEN_CONTRACT_ID: CBIMG76HIG2UJDRT65WZ6KQITSGQQ4G5ANA4LAEOQUYYES3TTVKOKQF6
      INDEXER_ENABLED: "true"
    ports:
      - "4000:4000"

volumes:
  tumaride_pgdata:
