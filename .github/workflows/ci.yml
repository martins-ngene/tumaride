name: Tuma Ride CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  soroban-contract:
    name: Soroban Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Soroban Unit Tests
        working-directory: contracts/delivery-escrow
        run: cargo test -- --nocapture

  backend-api:
    name: Backend Build, Smoke & System Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install
      - name: Build Shared Package
        run: npm --prefix packages/shared run build
      - name: Generate Prisma Client & Build Backend
        run: npm --prefix apps/backend run prisma:generate && npm --prefix apps/backend run build
      - name: Production Entrypoint Smoke Test
        run: npm --prefix apps/backend run test:smoke
      - name: Run System & Regression Test Suite
        run: npm --prefix apps/backend run test

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-api]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker build -f apps/backend/Dockerfile -t tumaride-backend:ci .
